name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.4'
          - '4.0'
    env:
      BUNDLE_WITHOUT: lint
    steps:
    - uses: actions/checkout@v4
    - name: Resolve gems for this Ruby
      if: matrix.ruby == '3.2'
      run: rm Gemfile.lock
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run the tests
      run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    name: RuboCop
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - name: Run RuboCop
      run: bundle exec rubocop
